<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>isoPod</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --sub: #6e6e73; --accent: #0071e3; --line: #d2d2d7; --bad: #e30000;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --sub: #98989d; --accent: #2997ff; --line: #3a3a3c; --bad: #ff453a; }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", Pretendard, "Segoe UI", sans-serif;
}
main { max-width: 560px; margin: 0 auto; padding: 56px 20px 40px; }
h1 { font-size: 34px; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 10px; }
.hint { color: var(--sub); margin: 0 0 28px; }
.code { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; color: var(--sub); }
.code input {
  width: 7.4ch; padding: 8px 6px 8px calc(6px + .25em); font: 600 28px/1 ui-monospace, "SF Mono", Menlo, monospace;
  letter-spacing: .25em; text-align: center; color: var(--text); background: var(--card);
  border: 1px solid var(--line); border-radius: 12px;
}
.code input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.drop {
  padding: 44px 20px; text-align: center; background: var(--card);
  border: 2px dashed var(--line); border-radius: 18px; transition: border-color .15s;
}
.drop.over { border-color: var(--accent); }
.drop p { margin: 0 0 14px; color: var(--sub); }
.drop button {
  font: inherit; font-weight: 600; color: #fff; background: var(--accent);
  border: 0; border-radius: 980px; padding: 10px 22px; cursor: pointer;
}
ul { list-style: none; padding: 0; margin: 22px 0 0; }
li { background: var(--card); border-radius: 12px; padding: 11px 14px; margin-bottom: 8px; }
.row { display: flex; justify-content: space-between; gap: 12px; }
.row span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.state { flex: none; color: var(--sub); }
li.bad .state { color: var(--bad); }
progress { display: block; width: 100%; height: 4px; margin-top: 8px; accent-color: var(--accent); }
li.ok progress, li.bad progress { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="hint" id="hint"></p>
  <label class="code"><span id="codeLabel"></span><input id="code" inputmode="numeric" maxlength="4" autocomplete="off"></label>
  <div class="drop" id="drop">
    <p id="dropText"></p>
    <button id="pick" type="button"></button>
    <input id="files" type="file" multiple hidden>
  </div>
  <ul id="list"></ul>
</main>
<script>
const S = __STRINGS__;
const $ = (id) => document.getElementById(id);
$("title").textContent = S.title;
$("hint").textContent = S.hint;
$("codeLabel").textContent = S.code;
$("dropText").textContent = S.drop;
$("pick").textContent = S.choose;

const code = $("code");
try { code.value = sessionStorage.getItem("isopod-code") || ""; } catch (e) {}
code.addEventListener("input", () => {
  code.value = code.value.replace(/\D/g, "").slice(0, 4);
  try { sessionStorage.setItem("isopod-code", code.value); } catch (e) {}
});

const queue = [];
let busy = false;

function add(file, path) {
  const li = document.createElement("li");
  li.innerHTML = '<div class="row"><span></span><span class="state"></span></div><progress max="1" value="0"></progress>';
  li.querySelector("span").textContent = path;
  $("list").prepend(li);
  queue.push({ file, path, li });
  next();
}

function finish(item, ok, text) {
  item.li.classList.add(ok ? "ok" : "bad");
  item.li.querySelector(".state").textContent = text;
}

function next() {
  if (busy || !queue.length) return;
  busy = true;
  const item = queue.shift();
  const xhr = new XMLHttpRequest();
  xhr.open("PUT", "/upload/" + item.path.split("/").map(encodeURIComponent).join("/"));
  xhr.setRequestHeader("X-Isopod-Code", code.value);
  xhr.upload.onprogress = (e) => { if (e.lengthComputable) item.li.querySelector("progress").value = e.loaded / e.total; };
  xhr.onload = () => {
    const messages = { 403: S.wrong_code, 415: S.unsupported, 507: S.no_space };
    finish(item, xhr.status === 201, xhr.status === 201 ? S.done : messages[xhr.status] || S.failed);
    if (xhr.status === 403) {
      queue.splice(0).forEach((q) => finish(q, false, S.wrong_code));
      code.focus();
    }
    busy = false;
    next();
  };
  xhr.onerror = () => { finish(item, false, S.failed); busy = false; next(); };
  xhr.send(item.file);
}

function walk(entry, prefix) {
  if (entry.isFile) {
    entry.file((f) => add(f, prefix + f.name));
  } else if (entry.isDirectory) {
    const reader = entry.createReader();
    const read = () => reader.readEntries((entries) => {
      if (!entries.length) return;
      entries.forEach((e) => walk(e, prefix + entry.name + "/"));
      read();
    });
    read();
  }
}

const drop = $("drop");
["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => drop.addEventListener(t, () => drop.classList.remove("over")));
drop.addEventListener("drop", (e) => {
  e.preventDefault();
  for (const it of e.dataTransfer.items) {
    const entry = it.webkitGetAsEntry && it.webkitGetAsEntry();
    if (entry) walk(entry, "");
    else if (it.kind === "file") add(it.getAsFile(), it.getAsFile().name);
  }
});
$("pick").addEventListener("click", () => $("files").click());
$("files").addEventListener("change", (e) => {
  for (const f of e.target.files) add(f, f.webkitRelativePath || f.name);
  e.target.value = "";
});
</script>
</body>
</html>
