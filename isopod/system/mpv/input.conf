# A video follows the rules of Now Playing. SDL names the buttons by the controller map:
# A is ACTION_DOWN, B is ACTION_RIGHT, X is ACTION_LEFT and Y is ACTION_UP.
#
#   A, Start   play or pause            B        leave, and remember the spot
#   left/right skip 10 s, held: go on   up/down  volume (isopodd sets it, as the volume keys do)
#   X          the next audio track     Y        subtitles, as Y is the lyrics of a song
#   Select     where the film is
#
# The shoulders do nothing, here as everywhere. Home, the volume keys, the power key and a
# headset's buttons belong to isopodd, which talks to mpv over its socket.
GAMEPAD_ACTION_DOWN cycle pause
GAMEPAD_START cycle pause
GAMEPAD_ACTION_RIGHT quit-watch-later
GAMEPAD_DPAD_LEFT seek -10
GAMEPAD_DPAD_RIGHT seek 10
GAMEPAD_ACTION_LEFT cycle audio
GAMEPAD_ACTION_UP cycle sub
GAMEPAD_BACK show-progress
GAMEPAD_DPAD_UP ignore
GAMEPAD_DPAD_DOWN ignore
GAMEPAD_LEFT_SHOULDER ignore
GAMEPAD_RIGHT_SHOULDER ignore
GAMEPAD_LEFT_TRIGGER ignore
GAMEPAD_RIGHT_TRIGGER ignore
GAMEPAD_MENU ignore
