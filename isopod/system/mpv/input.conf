# isoPod rules. SDL names follow the controller map, where A is ACTION_DOWN and B is ACTION_RIGHT.
# A pauses, B leaves and remembers the spot, left and right skip 10 s, up and down skip a minute.
# The shoulders do nothing, here as everywhere. Volume stays on the volume keys; Home belongs to isoPod.
GAMEPAD_ACTION_DOWN cycle pause
GAMEPAD_START cycle pause
GAMEPAD_ACTION_RIGHT quit-watch-later
GAMEPAD_DPAD_LEFT seek -10
GAMEPAD_DPAD_RIGHT seek 10
GAMEPAD_DPAD_UP seek 60
GAMEPAD_DPAD_DOWN seek -60
GAMEPAD_LEFT_SHOULDER ignore
GAMEPAD_RIGHT_SHOULDER ignore
GAMEPAD_LEFT_TRIGGER ignore
GAMEPAD_RIGHT_TRIGGER ignore
GAMEPAD_ACTION_UP show-progress
GAMEPAD_ACTION_LEFT cycle sub
GAMEPAD_BACK cycle audio
GAMEPAD_MENU ignore
