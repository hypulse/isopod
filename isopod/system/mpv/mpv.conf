# The cheap scalers are plenty at 640x480 and spare the battery.
profile=fast
fullscreen=yes
input-gamepad=yes
ao=pulse
hwdec=no
keep-open=no
osd-bar=yes
osd-duration=1500
osd-font-size=36
save-position-on-quit=yes
watch-later-dir=/storage/.cache/isopod/mpv
slang=ko,kor,en,eng
alang=ko,kor,ja,jpn,en,eng
sub-auto=fuzzy
sub-codepage=cp949
sub-fonts-dir=/usr/share/isopod/fonts
osd-fonts-dir=/usr/share/isopod/fonts
sub-font=Pretendard
osd-font=Pretendard
