# The cheap scalers are plenty at 640x480 and spare the battery.
profile=fast
fullscreen=yes
ao=pulse
hwdec=no
keep-open=no
osd-bar=yes
osd-duration=1500
osd-font-size=36
save-position-on-quit=yes
watch-later-dir=/storage/.cache/isopod/mpv
slang=ko,kor,en,eng
alang=ko,kor,ja,jpn,en,eng
sub-auto=fuzzy
sub-codepage=cp949
sub-fonts-dir=/usr/share/isopod/fonts
osd-fonts-dir=/usr/share/isopod/fonts
sub-font=Pretendard
osd-font=Pretendard

# Only the buttons input.conf names do anything. mpv's own defaults would also answer the
# volume keys (on top of isoPod, which sets the volume), quit on the power key and take a
# headset's buttons, all of which reach it through the compositor.
input-gamepad=yes
input-default-bindings=no
# A held left or right keeps skipping: about a minute of film for each second held.
input-ar-delay=400
input-ar-rate=6

# The volume is isoPod's, one level for each output. mpv plays at full scale and neither
# keeps a level of its own nor brings one back with a film.
volume=100
volume-max=100
watch-later-options-remove=volume
watch-later-options-remove=mute
# With the lid shut isopodd takes the picture away (vid=no) and gives it back when the lid
# opens; a film that closes in between still comes back with it.
watch-later-options-remove=vid
