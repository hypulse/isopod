# NetworkManager keeps a Wi-Fi switch of its own in a file under /var, which every boot
# starts without. Taking it for on, it lifted the block systemd-rfkill had restored, and
# the device joined a network until ROCKNIX's 080-network blocked the radio again. The
# file now follows ROCKNIX's setting whenever NetworkManager starts.
[Service]
ExecStartPre=-/bin/sh -c '. /etc/profile.d/001-functions; [ "$$(get_setting wifi.enabled)" = 0 ] && W=false || W=true; mkdir -p /var/lib/NetworkManager; { echo "[main]"; echo "WirelessEnabled=$$W"; } >/var/lib/NetworkManager/NetworkManager.state'
