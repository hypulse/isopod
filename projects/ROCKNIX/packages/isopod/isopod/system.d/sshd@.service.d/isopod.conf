# Each connection's sshd takes keys alone. The options come first on its command line, where
# sshd keeps the first value it is given, so no SSH_ARGS from sshd.conf can undo them.
[Service]
ExecStart=
ExecStart=-/usr/sbin/sshd -i -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no $SSH_ARGS
