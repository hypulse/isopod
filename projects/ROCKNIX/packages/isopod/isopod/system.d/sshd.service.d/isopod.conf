# The root password is ROCKNIX's, the same on every device and public, and isoPod joins
# whatever Wi-Fi it is carried to: sshd takes keys alone, whoever starts it, and does not
# run until the device has one.
[Unit]
ConditionFileNotEmpty=/storage/.ssh/authorized_keys

[Service]
Environment="SSH_ARGS=-o PasswordAuthentication=no -o KbdInteractiveAuthentication=no"
